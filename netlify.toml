[build]
  command = "npx convex deploy --cmd 'npm run build'"
  publish = "dist"

# every path is the app; it reads the address itself (e.g. /g/<code>)
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# the service worker is checked for updates on every visit
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"
